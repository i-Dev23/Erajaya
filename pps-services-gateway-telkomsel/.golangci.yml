# golangci-lint configuration
# Docs: https://golangci-lint.run/usage/configuration/
# Jalankan: make lint  (atau: golangci-lint run ./...)

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  sort-results: true

linters:
  enable:
    # === Bug Detection ===
    - errcheck          # Cek error yang tidak di-handle
    - staticcheck       # Mega-linter dari Go team
    - govet             # go vet bawaan
    - bodyclose         # Cek http.Response.Body tidak di-close
    - nilerr            # Cek return nil padahal err != nil

    # === Code Style ===
    - gofmt             # Harus di-format dengan gofmt
    - goimports         # Import harus terurut & grouped
    - revive            # Pengganti golint, lebih configurable
    - misspell          # Typo di comment/string
    - godot             # Comment harus diakhiri titik
    - whitespace        # Hapus blank line berlebih

    # === Complexity ===
    - cyclop            # Cyclomatic complexity
    - gocognit          # Cognitive complexity
    - funlen            # Panjang function

    # === Performance ===
    - prealloc          # Suggest preallocate slice
    - gocritic          # Opinionated style & performance checks

    # === Security ===
    - gosec             # Security issue scanner

    # === Test ===
    - thelper           # Cek t.Helper() di test helper
    - tparallel         # Cek t.Parallel() usage

  disable:
    - depguard          # Tidak perlu restrict import
    - wsl               # Terlalu opinionated soal whitespace

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
      - name: var-naming
      - name: indent-error-flow
      - name: error-return
      - name: error-strings
      - name: unexported-return
      - name: blank-imports

  cyclop:
    max-complexity: 15

  gocognit:
    min-complexity: 20

  funlen:
    lines: 80
    statements: 50

  govet:
    enable-all: true

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam          # Struct besar lewat value OK di Go (compiler optimizes)
      - rangeValCopy        # Kadang intentional

  gosec:
    excludes:
      - G104               # Unhandled error — sudah di-cover errcheck
      - G304               # File path dari variable — false positive di server code

  misspell:
    locale: US

  godot:
    scope: toplevel
    capital: true

issues:
  exclude-rules:
    # Test files boleh lebih panjang dan kurang strict
    - path: _test\.go
      linters:
        - funlen
        - cyclop
        - gocognit
        - gosec
        - errcheck

    # Wire generated code — skip semua
    - path: wire_gen\.go
      linters:
        - ALL

    # Main file — skip complexity
    - path: cmd/app/main\.go
      linters:
        - funlen
        - cyclop

  max-issues-per-linter: 50
  max-same-issues: 5

severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - govet
        - staticcheck
      severity: error
